# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## Environment Properties
# The Minecraft version must agree with the Forge version to get a valid artifact
minecraft_version=1.21.11
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[1.21.11,1.21.12)
# The Forge version must agree with the Minecraft version to get a valid artifact
forge_version=61.1.5
# The Forge version range can use any version of Forge as bounds or match the loader version range
forge_version_range=[61,)
# The loader version range can only use the major version of Forge as bounds
loader_version_range=[61,)
# EventBus 7 validator version pinned by the 1.21.11 MDK.
# CHECK THIS: confirm the exact pinned value against a real Gradle sync / the downloaded MDK zip
# before relying on it — this is the version documented in Forge's EventBus 7 migration guide,
# not one read directly from your repository.
eventbus_version=7.0-beta.7

## Mod Properties
mod_id=endoftheworld
mod_name=The End of the World
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=com.dari.endoftheworld
mod_authors=dari
mod_description=Survival mod in which the Overworld is gradually destroyed by escalating cataclysms and the player must restore and reach an underground bunker to survive.
